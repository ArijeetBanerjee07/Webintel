name: CI Quality Gate

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-naming-check:
    name: Verify Branch Naming
    if: github.event_name == 'pull_request' && github.base_ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Branch Name Convention
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Checking PR branch: $BRANCH_NAME"
          if [[ ! "$BRANCH_NAME" =~ ^(feature|fix|hotfix|chore)/[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Branch name '$BRANCH_NAME' does not adhere to the team convention!"
            echo "All PRs into 'staging' must originate from branches named: 'feature/<purpose>' (or fix/<purpose>, hotfix/<purpose>)"
            exit 1
          fi
          echo "Branch naming convention verified: $BRANCH_NAME"

  test-and-build:
    name: Type Check, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js Production Build
        run: npm run build

